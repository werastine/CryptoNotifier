syntax = "proto3";

package crypto;

option go_package = "github.com/werastine/CryptoNotifier/pkg/pb";

// Crypto service manages price rate streaming and alert notifications
service Crypto {
    // PushRates pushes price ticks from the ingestion layer
    rpc PushRates (stream PriceTick) returns (PushSummary) {};

    // WaitNotification sends request with target price from notification layer
    // and listens for alert notifications
    rpc WaitNotification (NotifyRequest) returns (stream PriceTick) {};
}

enum Condition {
  CONDITION_UNSPECIFIED = 0;
  CONDITION_ABOVE = 1; // >= 0
  CONDITION_BELOW = 2; // <= 0
  
}

message PushSummary {
    int32 count = 1;
}

message PriceTick {
    string symbol = 1;
    string price = 2;
}

message NotifyRequest {
    string symbol = 1;
    string target_price = 2;
    Condition condition = 3;

}